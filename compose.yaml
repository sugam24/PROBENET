
name: probenet

services:
  db:
    image: postgres:17
    restart: unless-stopped

    profiles:
      - storage

    environment:
      POSTGRES_USER: probenet
      POSTGRES_PASSWORD: ${PROBENET_DB_PASSWORD:?Set PROBENET_DB_PASSWORD}
      POSTGRES_DB: probenet

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probenet -d probenet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
